<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title> Curral Velho - Exposição Virtual</title>
  <!-- CSS compartilhado por todas as páginas do site (ver estilos.css) -->
  <link rel="stylesheet" href="estilos.css">
</head>
<!-- A classe "pagina-relato-interativa" no body diz ao estilos.css qual conjunto de
     regras usar nesta página (veja o comentário no topo do estilos.css) -->
<body class="pagina-relato-interativa">

  <header>
    Curral Velho - Crateús/CE
  </header>

  <div class="conteudo-principal">

      <!-- 1️⃣ Foto, com o ícone de comentário no canto -->
      <div class="post-container">
          <div class="imagem-container">
            <img src="curralvelho.jpeg" alt="Foto de Palmares">
            
            <div class="interacao-foto">
                <span id="icone-comentar" class="icone-comentario" title="Deixar um Comentário">💬</span>
            </div>
          </div>
          
          <!-- 2️⃣ Autor -->
          <div class="autor-container" style="margin-top: 20px;">
            <p class="autor">Francisca Williana Gomes Bezerra</p>
          </div>

          <!-- 3️⃣ Relato -->
          <div class="relato" style="max-width: none; margin: 0;">
            <p>
              Relato da autora. Aqui pode ser incluída a história, lembrança ou significado dessa fotografia, destacando o valor cultural e emocional da comunidade de Palmares.
            </p>
          </div>
      </div>
      
      <!-- 4️⃣ Sidebar de comentários (começa fechada, veja .sidebar-comentarios no estilos.css) -->
      <div id="sidebar-comentarios" class="sidebar-comentarios">
          
          <div class="header-sidebar">
              <span>Deixe seu relato ou comentário ✍️</span>
              <button id="botao-fechar" class="botao-fechar" title="Fechar Comentários">✕</button>
          </div>

          <div class="form-style">
              <form id="form-comentario">
                  
                  <label for="nome">Seu nome</label>
                  <input type="text" id="nome" name="nome" required placeholder="Seu nome">

                  <label for="comunidade">Sua comunidade (opcional)</label>
                  <input type="text" id="comunidade" name="comunidade" placeholder="Sua comunidade (opcional)">
                  
                  <label for="relato-comentario">Escreva seu relato aqui...</label>
                  <textarea id="relato-comentario" name="relato-comentario" required placeholder="Escreva seu relato aqui..."></textarea>
                  
                  <div class="divisor-form"></div>

                  <button type="submit">Enviar</button>
              </form>
          </div>
      </div>
  </div>

  <footer>
    <a href="index.html" class="voltar">⬅ Ver mais</a>
  </footer>
  
  <!-- Script: controla a abertura/fechamento da sidebar e o envio (simulado) do formulário -->
  <script>
    const iconeComentar = document.getElementById('icone-comentar');
    const sidebar = document.getElementById('sidebar-comentarios');
    const botaoFechar = document.getElementById('botao-fechar');
    const formComentario = document.getElementById('form-comentario');

    // Função para abrir/fechar a sidebar
    function toggleSidebar() {
        const isOpen = sidebar.classList.toggle('aberto');

        // Se estiver em mobile e abrindo, rola para a sidebar
        if (isOpen && window.innerWidth <= 992) {
            sidebar.scrollIntoView({ behavior: 'smooth', block: 'start' });
        }
    }

    // Eventos para abrir a sidebar ao clicar no ícone
    iconeComentar.addEventListener('click', toggleSidebar);

    // Eventos para fechar a sidebar ao clicar no botão X
    botaoFechar.addEventListener('click', toggleSidebar);

    // Ação ao tentar enviar o formulário (simulação)
    formComentario.addEventListener('submit', function(event) {
        event.preventDefault(); 
        
        var nome = document.getElementById('nome').value;
        var comunidade = document.getElementById('comunidade').value;
        var comentario = document.getElementById('relato-comentario').value;
        
        alert('Relato enviado com sucesso (simulação)!\nNome: ' + nome + '\nComunidade: ' + (comunidade || 'Não informada') + '\nRelato: ' + comentario);
        
        // Limpar o formulário e fechar a sidebar
        this.reset();
        sidebar.classList.remove('aberto');
    });
  </script>

</body>
</html>
