<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Pontos de Memórias</title>
  <!-- CSS compartilhado por todas as páginas do site (ver estilos.css) -->
  <link rel="stylesheet" href="./style/estilos.css">
</head>
<!-- A classe "pagina-inicial" no body diz ao estilos.css qual conjunto de
     regras usar nesta página (veja o comentário no topo do estilos.css) -->
<body class="pagina-inicial">
  <header>Pontos de Memórias 🪶</header>

  <!-- 1️⃣ Grade de "pontos": cada link leva para a página de relato daquele lugar -->
  <div class="pontos">
    <a href="./pages/curral velho/curralvelho.html" class="ponto">
      <img src="./images/botao.jpg" alt="Curral Velho">
      <p>Curral Velho</p>
    </a>

    <a href="./pages/ibiapaba/ibiapaba.html" class="ponto">
      <img src="./images/botao.jpg" alt="Ibiapaba">
      <p>Ibiapaba</p>
    </a>

    <a href="./pages/palmares/palmares.html" class="ponto">
      <img src="./images/botao.jpg" alt="Palmares II">
      <p>Palmares II</p>
    </a>

    <a href="./pages/barra do rio/barradorio.html" class="ponto">
      <img src="./images/botao.jpg" alt="Barra do Rio">
      <p>Barra do Rio</p>
    </a>

    <a href="./pages/poti/poti.html" class="ponto">
      <img src="./images/botao.jpg" alt="Poti">
      <p>Poti</p>
    </a>

    <a href="./pages/cabaças/cabacas.html" class="ponto">
      <img src="./images/botao.jpg" alt="Cabaças">
      <p>Cabaças</p>
    </a>
  </div>

  <!-- 2️⃣ Formulário de comentários gerais (fica salvo no localStorage do navegador) -->
  <div class="comentarios">
    <h2>Deixe seu relato ou comentário ✍️</h2>
    <form id="formComentario">
      <input type="text" id="nome" placeholder="Seu nome" required>
      <input type="text" id="comunidade" placeholder="Sua comunidade (opcional)">
      <textarea id="mensagem" rows="4" placeholder="Escreva seu relato aqui..." required></textarea>
      <button class="btn-enviar" type="submit">Enviar</button>
    </form>

    <div class="lista-comentarios" id="listaComentarios"></div>
  </div>

  <footer>
    Projeto Fronteiras de Memórias • UFC Crateús
  </footer>

<!-- Script: salva/lê os comentários no localStorage e controla a exclusão protegida por senha -->
<script>
  // Variável para a senha secreta
  const SENHA_ORGANIZADOR = "memorias2025";

  // Função para escapar HTML
  function escapeHtml(text) {
    if (!text && text !== 0) return '';
    return String(text)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;")
      .replace(/\n/g, "<br>");
  }

  const form = document.getElementById('formComentario');
  const lista = document.getElementById('listaComentarios');

  /**
   * Função para carregar e exibir os comentários, incluindo o botão de exclusão.
   */
  function carregarComentarios() {
    const comentarios = JSON.parse(localStorage.getItem('comentarios') || '[]');
    lista.innerHTML = '';

    comentarios.forEach((c, index) => {
      const div = document.createElement('div');
      div.className = 'comentario';
      div.innerHTML = `
        <strong>${escapeHtml(c.nome)}</strong>
        ${c.comunidade ? `(${escapeHtml(c.comunidade)})` : ''}:<br>
        ${escapeHtml(c.mensagem)}
        <button class="btn-excluir" data-index="${index}">x</button>
      `;
      lista.appendChild(div);
    });
    
    // Adiciona event listeners aos novos botões
    document.querySelectorAll('.btn-excluir').forEach(button => {
        button.addEventListener('click', function() {
            const indexParaDeletar = this.getAttribute('data-index');
            excluirComentario(parseInt(indexParaDeletar));
        });
    });
  }

  /**
   * Função para excluir um comentário específico pelo índice.
   * @param {number} index - O índice do comentário a ser excluído.
   */
  function excluirComentario(index) {
      const senha = prompt("Digite a senha de organizador para apagar este comentário:");
      
      if (senha === SENHA_ORGANIZADOR) {
          if (confirm("Tem certeza que deseja apagar ESTE comentário?")) {
              const comentarios = JSON.parse(localStorage.getItem('comentarios') || '[]');
              
              if (index > -1 && index < comentarios.length) {
                  // Remove 1 elemento no índice especificado
                  comentarios.splice(index, 1);
                  localStorage.setItem('comentarios', JSON.stringify(comentarios));
                  carregarComentarios(); // Recarrega a lista
                  alert("Comentário apagado com sucesso!");
              } else {
                  alert("Erro: índice de comentário inválido.");
              }
          }
      } else if (senha !== null) {
          alert("Senha incorreta.");
      }
  }

  // Evento de envio do formulário
  form.addEventListener('submit', e => {
    e.preventDefault();
    const nome = document.getElementById('nome').value.trim();
    const comunidade = document.getElementById('comunidade').value.trim();
    const mensagem = document.getElementById('mensagem').value.trim();

    if (!nome || !mensagem) {
      alert('Por favor, preencha seu nome e comentário.');
      return;
    }

    const comentarios = JSON.parse(localStorage.getItem('comentarios') || '[]');
    comentarios.push({ nome, comunidade, mensagem });
    localStorage.setItem('comentarios', JSON.stringify(comentarios));

    form.reset();
    carregarComentarios();
  });

  // Carrega os comentários na inicialização
  carregarComentarios();

  // A função secreta de atalho para apagar todos os comentários foi removida,
  // pois agora a exclusão individual é a principal forma de moderação.
  // Se quiser manter a função de limpeza total, insira-a aqui novamente.
</script>
</body>
</html>
