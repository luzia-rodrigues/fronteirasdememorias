<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Poti - Exposição Virtual</title>
  <!-- CSS compartilhado por todas as páginas do site (ver estilos.css) -->
  <link rel="stylesheet" href="../../style/estilos.css">
</head>
<!-- A classe "pagina-relato-simples" no body diz ao estilos.css qual conjunto de
     regras usar nesta página (veja o comentário no topo do estilos.css) -->
<body class="pagina-relato-simples">

  <header>
    Poti - Crateús/CE
  </header>

  <!-- 1️⃣ Fotos -->
  <div class="imagens">
    <div class="imagem-container">
      <img src="../../images/poti1.jpeg" alt="Foto de Poti 1">
    </div>

    <div class="imagem-container">
      <img src="../../images/poti2.jpeg" alt="Foto de Poti 2">
    </div>

    <div class="imagem-container">
      <img src="../../images/poti3.jpeg" alt="Foto de Poti 3">
    </div>
  </div>

  <!-- 2️⃣ Autor -->
  <div class="autor-container">
    <p class="autor">Emerson da Silva Marques</p>
  </div>

  <!-- 3️⃣ Relato -->
  <div class="relato">
    <p>
      Relato do autor sobre as fotos. Aqui você pode escrever o contexto, impressões ou histórias relacionadas às imagens.  
      O texto pode descrever o ambiente, as pessoas retratadas, as memórias ou o significado cultural das fotografias.
    </p>
  </div>

  <footer>
    <a href="../../index.html" class="voltar">⬅ Voltar ao início</a>
  </footer>

</html>
